name: Deploy worker

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
        description: The OS to run on.
      pytest-debug:
        required: false
        type: string
        description: Set this to make pytest emit debug logs.
      python-version:
        required: true
        type: string
        description: The python version to run.

permissions:
  contents: write

jobs:
  integration-tests:
    uses: ./.github/workflows/integration_test_worker.yml
    with:
      os: ${{ inputs.os }}
      python-version: ${{ inputs.python-version }}
    secrets: inherit
  update_semver_tags:
    runs-on: ${{ inputs.os }}
    needs: integration-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'
      - run: pip install twine
      - name: Debugging
        run: |
          type -P grep
          grep -P "" Makefile || echo "-P unsupported"
          type -P tr
          type -P cut
          type -P cat
      - name: Check that the python version in the code matches the tag
        run: |
          REPO_VERSION=$(make version)
          if [ "refs/tags/v$REPO_VERSION" != "${{ github.ref }}" ]; then
            echo "Declared version in repository does not match tag '${{ github.ref }}'"
            exit 1
          fi
      - run: make publish_git_tags
  publish_to_test_pypi:
    runs-on: ${{ inputs.os }}
    needs: update_semver_tags
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'
      - name: Publish to test PyPi
        run: make publish_test_pypi
        env:
          SKIP_DOWNLOAD: 1
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.ASTRO_PI_REPLAY_TEST_PYPI_API_KEY }}
      - name: Notify alerts channel of failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        uses: rtCamp/action-slack-notify@v2.2.1
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: ${{ job.status }}
          SLACK_TITLE: Failure Message
          MSG_MINIMAL: actions url, commit, ref
          SLACK_FOOTER: Build failure
  smoke_tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    uses: ./.github/workflows/smoke_test_worker.yml
    needs: publish_to_test_pypi
    with:
      os: ${{ matrix.os }}
      python-version: ${{ inputs.python-version }}
    secrets: inherit
  publish_to_prod_pypi:
    runs-on: ${{ inputs.os }}
    needs: smoke_tests
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'
      - name: Publish to test PyPi
        run: make publish_prod_pypi
        env:
          SKIP_DOWNLOAD: 1
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.ASTRO_PI_REPLAY_PYPI_API_KEY }}
      - name: Notify alerts channel of failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        uses: rtCamp/action-slack-notify@v2.2.0
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: ${{ job.status }}
          SLACK_TITLE: Failure Message
          MSG_MINIMAL: actions url, commit, ref
          SLACK_FOOTER: Build failure

