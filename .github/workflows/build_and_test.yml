name: Build and test workflow

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Midnight every month
    - cron: "0 0 1 * *"

permissions:
  contents: read

jobs:
  build_and_test_python:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'
      - name: Build and test python
        run: |
          make test build_python
