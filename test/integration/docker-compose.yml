services:
  # Proxy to AWS S3 asset bucket, with (indefinite) local caching
  s3_proxy:
    build:
      context: .
      dockerfile_inline: |
        FROM nginx:latest
        ADD object_store_nginx.conf /etc/nginx/conf.d/default.conf
    ports:
      - 8081:80
    volumes:
      # Mount astro_pi_replay_assets directory to /var/cache/nginx
      - ${CACHE_PATH:-./.cache}:/var/cache/nginx

