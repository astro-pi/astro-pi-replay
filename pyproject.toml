[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astro_pi_replay"
description = "A CLI to replay historic data from previous ISS missions."
dynamic = ["version"]
authors = [
  { name="Geraint Ballinger", email="geraint.ballinger@raspberrypi.org" }
]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent"
]
dependencies = [
  "colorzero",
  "pandas",
  "Pillow",
  "skyfield",
  "typing_extensions",
  "tqdm",
  "scipy",
  "exif",
  "numpy"
]

[project.scripts]
Astro-Pi-Replay = "astro_pi_replay.main:main"

[project.urls]
Homepage = "https://github.com/astro-pi/Astro-Pi-Replay"

[tool.setuptools.dynamic]
version = {attr = "astro_pi_replay.__init__.__version__"}

[tool.isort]
atomic = true
line_length = 88
profile = "black"
skip_gitignore = true
src_paths = ["src", "test"]
skip_glob = ["test/resources", "venv"]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
(
  ^/test/resources
)
'''

[tool.bandit]
skips = ["B101", "B404"]
exclude = ["test/resources"]

