[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astro_pi_replay"
description = "A CLI to replay historic data from previous ISS missions."
dynamic = ["version"]
authors = [
  { name="Geraint Ballinger", email="geraint.ballinger@raspberrypi.org" }
]
license = { file = "LICENCE.txt" }
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent"
]

# For some dependencies with C headers, the dependency strategy
# is:
#
# - Pin a version for astro-pi-replay-online (which at time of
# writing will use Pyodide v0.29)
# - Pin a version for RP OS Trixie (and any other OS with
# a relatively recent Python version).
# - Pin a 'catchall' dependency that may allow the tool to be
# installed on older systems.
#
# Only the top two pins should be tested.
#
# Example package version differences:
#
# + ----------------- + ------ + -------- + --------------------- +
# |                   |  Raspberry Pi OS  |        Pyodide        |
# + ----------------- + ------ + -------- + --------------------- +
# | Dependency name   | Trixie | Bookworm | v0.29.0   | v0.27.7   |
# + ----------------- + ------ + -------- + --------- + --------- +
# | colorzero         | 2.0    | 2.0      | N.A.      | N.A.      |
# | pandas            | 2.2.3  | 1.5.3    | 2.3.2     | 2.2.3     |
# | Pillow            | 11.1.0 | 9.4.0    | 11.3.0    | 10.2.0    |
# | requests          | 2.32.3 | 2.28.1   | 2.32.4    | 2.31.0    |
# | skyfield          | 1.53   | 1.45     | -         | -         |
# | typing_extensions | 4.13.2 | 4.4.0    | 4.15.0    | 4.11.0    |
# | tqdm              | 4.67.1 | -        | 4.67.1    | 4.66.2    |
# | setuptools        | 78.1.1 | 66.1.1   | 76.0.0    | 69.5.1    |
# | scipy             | 1.15.3 | 1.10.1   | 1.14.1    | 1.14.1    |
# | numpy             | 2.2.4  | 1.24.2   | 2.2.5     | 2.0.2     |
# | piexif            | 1.1.3  | 1.1.3    | N.A.      | N.A.      |
# | opencv            | 4.10.0 | 4.6.0    | 4.11.0.86 | 4.10.0.84 |
# + ----------------- + ------ + -------- + --------------------- +
#
dependencies = [
  # astro-pi-replay-online
  "pandas ~= 2.3.2; sys_platform=='emscripten'",
  # RP OS Trixie
  "pandas ~= 2.2.3; sys_platform!='emscripten' and python_version >= '3.12'",
  # Other
  "pandas; sys_platform!='emscripten' and python_version < '3.12'",

  # astro-pi-replay-online
  "Pillow ~= 11.3.0; sys_platform=='emscripten'",
  # RP OS Trixie
  "Pillow ~= 11.1.0; sys_platform!='emscripten' and python_version >= '3.12'",
  # Other
  "Pillow; sys_platform!='emscripten' and python_version < '3.12'",

  # astro-pi-replay-online
  "scipy ~= 1.14.1; sys_platform=='emscripten'",
  # RP OS Trixie
  "scipy ~= 1.15.3; sys_platform!='emscripten' and python_version >= '3.12'",
  # Other
  "scipy; sys_platform!='emscripten' and python_version < '3.12'",

  # astro-pi-replay-online
  "numpy ~= 2.2.5; sys_platform=='emscripten'",
  # RP OS Trixie
  "numpy ~= 2.2.4; sys_platform!='emscripten' and python_version >= '3.12'",
  # Other
  "numpy; sys_platform!='emscripten' and python_version < '3.12'",

  # astro-pi-replay-online
  "opencv-python ~= 4.11.0.0; sys_platform=='emscripten'",
  # RP OS Trixie
  "opencv-python ~= 4.10.0.0; sys_platform!='emscripten' and python_version >= '3.12'",
  # Other
  "opencv-python; sys_platform!='emscripten' and python_version < '3.12'",

  "skyfield ~= 1.46",

  # <none-any> dependencies
  "requests ~= 2.28",
  "colorzero ~= 2.0",
  "typing_extensions ~= 4.11",
  "tqdm ~= 4.66",
  "setuptools >= 61.0",
  "piexif >=1.1.3,<2",
]


[project.scripts]
Astro-Pi-Replay = "astro_pi_replay.main:main"

[project.urls]
Homepage = "https://github.com/astro-pi/Astro-Pi-Replay"

[tool.setuptools.dynamic]
version = {attr = "astro_pi_replay.__init__.__version__"}

[tool.isort]
atomic = true
line_length = 88
profile = "black"
skip_gitignore = true
src_paths = ["src", "test"]
skip_glob = ["test/resources", "venv"]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
(
  ^/test/resources
)
'''

[tool.bandit]
skips = ["B101", "B404"]
exclude = ["test/resources"]

[tool.pyright]
pythonPlatform = "All"

